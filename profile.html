<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>الملف الشخصي</title>

<style>

body{
background:#111;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.card{
width:350px;
background:#1d1d1d;
padding:25px;
border-radius:20px;
color:white;
text-align:center;
}

.avatar{
width:100px;
height:100px;
border-radius:50%;
background:#ff7a00;
margin:auto;
margin-bottom:15px;
display:flex;
align-items:center;
justify-content:center;
font-size:40px;
font-weight:bold;
}

.info{
background:#2b2b2b;
padding:12px;
margin-top:10px;
border-radius:12px;
text-align:right;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:12px;
background:#ff7a00;
color:white;
font-size:16px;
cursor:pointer;
}

</style>

</head>

<body>

<div class="card">

<div class="avatar" id="avatar">
؟
</div>

<h2 id="userName">
جار التحميل...
</h2>

<div class="info">
📧 <span id="userEmail"></span>
</div>

<div class="info">
📱 <span id="userPhone"></span>
</div>

<button onclick="logout()">
تسجيل خروج
</button>

</div>

<script type="module">

import { auth, db }
from "./firebase-config.js";

import {
onAuthStateChanged,
signOut
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
doc,
getDoc
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

onAuthStateChanged(auth, async(user)=>{

if(!user){

window.location.href="index.html";

return;

}

const docRef =
doc(db,"users",user.uid);

const docSnap =
await getDoc(docRef);

if(docSnap.exists()){

const data =
docSnap.data();

userName.innerText =
data.name;

userEmail.innerText =
data.email;

userPhone.innerText =
data.phone;

avatar.innerText =
data.name.charAt(0);

}
else{

userName.innerText =
user.email;

userEmail.innerText =
user.email;

userPhone.innerText =
"لا يوجد رقم";

avatar.innerText =
user.email.charAt(0);

}

});

window.logout = async()=>{

await signOut(auth);

window.location.href="index.html";

}

</script>

</body>
</html>
