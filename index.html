<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TAYYAR AUTH</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial;
}

body{
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
}

.box{
width:350px;
background:#1d1d1d;
padding:25px;
border-radius:20px;
}

h2{
text-align:center;
color:#ff7a00;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#2b2b2b;
color:white;
}

button{
width:100%;
padding:14px;
margin-top:10px;
border:none;
border-radius:12px;
background:#ff7a00;
color:white;
font-size:16px;
cursor:pointer;
}

.link{
margin-top:15px;
text-align:center;
color:#ff7a00;
cursor:pointer;
}

.section{
display:none;
}

.section.active{
display:block;
}

</style>

</head>

<body>

<div class="box">

<!-- LOGIN -->

<div id="login" class="section active">

<h2>تسجيل الدخول</h2>

<input
id="loginEmail"
type="email"
placeholder="البريد الإلكتروني">

<input
id="loginPassword"
type="password"
placeholder="كلمة المرور">

<button onclick="login()">
تسجيل الدخول
</button>

<button onclick="googleLogin()">
الدخول بواسطة جوجل
</button>

<div
class="link"
onclick="showRegister()">

إنشاء حساب

</div>

<div
class="link"
onclick="showReset()">

نسيت كلمة المرور؟

</div>

</div>

<!-- REGISTER -->

<div id="register" class="section">

<h2>إنشاء حساب</h2>

<input
id="name"
placeholder="الاسم">

<input
id="phone"
placeholder="رقم الهاتف">

<input
id="registerEmail"
type="email"
placeholder="البريد الإلكتروني">

<input
id="registerPassword"
type="password"
placeholder="كلمة المرور">

<button onclick="register()">

إنشاء حساب

</button>

<div
class="link"
onclick="showLogin()">

لدي حساب بالفعل

</div>

</div>

<!-- RESET -->

<div id="reset" class="section">

<h2>نسيت كلمة المرور</h2>

<input
id="resetEmail"
type="email"
placeholder="البريد الإلكتروني">

<button onclick="resetPassword()">

إرسال رابط الاستعادة

</button>

<div
class="link"
onclick="showLogin()">

رجوع

</div>

</div>

</div>

<script type="module">

import { auth, db }
from "./firebase-config.js";

import {

createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendPasswordResetEmail,
GoogleAuthProvider,
signInWithPopup

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {

doc,
setDoc

}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.showRegister=()=>{

login.classList.remove("active");
reset.classList.remove("active");
register.classList.add("active");

}

window.showLogin=()=>{

register.classList.remove("active");
reset.classList.remove("active");
login.classList.add("active");

}

window.showReset=()=>{

login.classList.remove("active");
register.classList.remove("active");
reset.classList.add("active");

}

window.register = async ()=>{

try{

const userCredential =
await createUserWithEmailAndPassword(
auth,
registerEmail.value,
registerPassword.value
);

await setDoc(
doc(db,"users",userCredential.user.uid),
{
name:name.value,
phone:phone.value,
email:registerEmail.value
}
);

alert("تم إنشاء الحساب");

showLogin();

}catch(error){

alert(error.code);

}

}

window.login = async ()=>{

try{

await signInWithEmailAndPassword(
auth,
loginEmail.value,
loginPassword.value
);

window.location.href="profile.html";

}catch(error){

alert(error.code);

}

}

window.resetPassword = async ()=>{

try{

await sendPasswordResetEmail(
auth,
resetEmail.value
);

alert("تم إرسال الرابط");

}catch(error){

alert(error.code);

}

}

window.googleLogin = async ()=>{

try{

const provider =
new GoogleAuthProvider();

await signInWithPopup(
auth,
provider
);

window.location.href="profile.html";

}catch(error){

alert(error.code);

}

}

</script>

</body>
</html>
