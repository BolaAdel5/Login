<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>

<style>
body{
font-family:Arial;
background:#111;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
background:#1c1c1c;
padding:25px;
border-radius:20px;
width:320px;
color:white;
}

h2{
text-align:center;
color:#ff7a00;
}

input{
width:100%;
padding:12px;
margin:8px 0;
border:none;
border-radius:10px;
background:#2a2a2a;
color:white;
}

button{
width:100%;
padding:12px;
margin-top:10px;
border:none;
border-radius:10px;
background:#ff7a00;
color:white;
font-size:16px;
cursor:pointer;
}

.link{
text-align:center;
margin-top:10px;
cursor:pointer;
color:#ff7a00;
}
</style>
</head>
<body>

<div class="box">

<h2>تسجيل الدخول</h2>

<input id="email" type="email" placeholder="البريد الإلكتروني">

<input id="password" type="password" placeholder="كلمة المرور">

<button onclick="login()">دخول</button>

<button onclick="register()">إنشاء حساب</button>

<div class="link" onclick="resetPassword()">
نسيت كلمة المرور؟
</div>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8VTVOL750GJiWrd0o979zI79ZN5aGdMU",
  authDomain: "login-2b974.firebaseapp.com",
  projectId: "login-2b974",
  storageBucket: "login-2b974.firebasestorage.app",
  messagingSenderId: "560611475312",
  appId: "1:560611475312:web:f67fec6f2d8795af9019b5",
  measurementId: "G-WJ89BXPQZX"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.register = async ()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert("تم إنشاء الحساب بنجاح");

}catch(err){

alert(err.message);

}

};

window.login = async ()=>{

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("تم تسجيل الدخول");

window.location.href="home.html";

}catch(err){

alert(err.message);

}

};

window.resetPassword = async ()=>{

const email =
document.getElementById("email").value;

if(!email){

alert("اكتب البريد الإلكتروني");

return;

}

try{

await sendPasswordResetEmail(
auth,
email
);

alert("تم إرسال رابط إعادة التعيين");

}catch(err){

alert(err.message);

}

};

</script>

</body>
</html>
