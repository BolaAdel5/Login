<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Firebase Login</title>

<style>

body{
background:#111;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
}

.box{
width:340px;
background:#1d1d1d;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,.3);
}

h2{
text-align:center;
color:#ff7a00;
margin-bottom:20px;
}

input{
width:100%;
padding:14px;
margin-bottom:10px;
border:none;
border-radius:12px;
background:#2b2b2b;
color:white;
box-sizing:border-box;
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#ff7a00;
color:white;
font-size:16px;
margin-top:10px;
cursor:pointer;
}

.link{
text-align:center;
margin-top:15px;
color:#ff7a00;
cursor:pointer;
}

</style>

</head>
<body>

<div class="box">

<h2>تسجيل الدخول</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني">

<input
id="password"
type="password"
placeholder="كلمة المرور">

<button onclick="register()">
إنشاء حساب
</button>

<button onclick="login()">
تسجيل الدخول
</button>

<div
class="link"
onclick="resetPassword()">

نسيت كلمة المرور؟

</div>

</div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
sendPasswordResetEmail
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB8VTVOL750GJiWrd0o979zI79ZN5aGdMU",
  authDomain: "login-2b974.firebaseapp.com",
  projectId: "login-2b974",
  storageBucket: "login-2b974.firebasestorage.app",
  messagingSenderId: "560611475312",
  appId: "1:560611475312:web:f67fec6f2d8795af9019b5",
  measurementId: "G-WJ89BXPQZX"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

window.register = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

try{

await createUserWithEmailAndPassword(
auth,
email,
password
);

alert("✅ تم إنشاء الحساب بنجاح");

}
catch(error){

alert(error.code);

}

}

window.login = async function(){

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

alert("✅ تم تسجيل الدخول بنجاح");

// لو عندك صفحة رئيسية
// window.location.href = "home.html";

}
catch(error){

alert(error.code);

}

}

window.resetPassword = async function(){

const email =
document.getElementById("email").value.trim();

if(!email){

alert("اكتب البريد الإلكتروني");

return;

}

try{

await sendPasswordResetEmail(
auth,
email
);

alert(
"📩 تم إرسال رابط إعادة تعيين كلمة المرور"
);

}
catch(error){

alert(error.code);

}

}

</script>

</body>
</html>
